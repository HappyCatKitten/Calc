[package]
name = "calc-core"
version = "1.2.1"
edition = "2021"
license = "MIT"
description = "A native Qt/QML calculator with native Rust arithmetic"
repository = "https://github.com/HappyCatKitten/Calc"
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
